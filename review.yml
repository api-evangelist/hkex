    note: Public fee schedules; market data pricing is licensing-based, no self-serve tiers.
  ownership: |
    Hong Kong Exchanges and Clearing Limited is itself a listed company
    (SEHK stock code 388) and is the parent of the London Metal Exchange
    (LME) and LME Clear. It is not owned by another market data platform.
