name: HKEX
kind: company
description: HKEX (Hong Kong Exchanges and Clearing Limited, SEHK 388) operates the
  Stock Exchange of Hong Kong, the Hong Kong Futures Exchange, and their clearing
  houses, and also owns the London Metal Exchange. As an exchange data arm it sells
  real-time securities and derivatives market data through the sales-gated HKEX Orion
  Market Data (OMD) platform - binary multicast datafeeds licensed to vendors and
  subscribers rather than a self-serve HTTP API - plus historical tick, full order
  book, and CCASS shareholding reference data through the HKEX Data Marketplace,
  delivered via SFTP, cloud-to-cloud transfer, and direct download. Its one publicly
  documented RESTful JSON API is the FINI API Gateway for IPO settlement workflows,
  restricted to registered market participants using OAuth 2.0 JWT credentials.
