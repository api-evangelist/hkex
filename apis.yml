apis:
- aid: hkex:hkex-orion-market-data-securities-omd-c
  name: HKEX Orion Market Data Platform - Securities Market (OMD-C)
  tags:
  - Market Data
  - Real-Time
  - Securities
  - Multicast
  - Order Book
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.hkex.com.hk/Services/Market-Data-Services/Infrastructure/HKEX-Orion-Market-Data-Platform-Securities-Market-OMD-C?sc_lang=en
  properties:
  - url: https://www.hkex.com.hk/Services/Market-Data-Services/Infrastructure/HKEX-Orion-Market-Data-Platform-Securities-Market-OMD-C?sc_lang=en
    type: Documentation
  - url: https://www.hkex.com.hk/eng/prod/dataprod/Documents/HKEX_OMD-C_Binary_Interface_Specifications_v1.39b.pdf
    type: APIReference
  description: Real-time datafeeds (OMD-C SS, SP, SF tiers) for all securities traded
    on the Stock Exchange of Hong Kong, published in a proprietary binary message
    format over one-to-many IP multicast/UDP for high throughput and low latency.
    Not an HTTP API - access is licensed through HKEX data licensing agreements, and
    the binary interface specifications and connectivity guides are public PDFs.
- aid: hkex:hkex-orion-market-data-derivatives-omd-d
  name: HKEX Orion Market Data Platform - Derivatives Market (OMD-D)
  tags:
  - Market Data
  - Real-Time
  - Derivatives
  - Futures
  - Options
  - Multicast
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.hkex.com.hk/Services/Market-Data-Services/Infrastructure/HKEX-Orion-Market-Data-Platform-Derivatives-Market-OMD-D?sc_lang=en
  properties:
  - url: https://www.hkex.com.hk/Services/Market-Data-Services/Infrastructure/HKEX-Orion-Market-Data-Platform-Derivatives-Market-OMD-D?sc_lang=en
    type: Documentation
  - url: https://www.hkex.com.hk/-/media/HKEX-Market/Services/Market-Data-Services/Infrastructure/HKEX-Orion-Market-Data-Platform-Derivatives-Market-OMD-D/HKEX-OMDD-Developers-Guide-v1,-d-,26.pdf
    type: APIReference
  description: Real-time datafeeds (OMD-D DS, DP, DF tiers) for futures and options
    traded on the Hong Kong Futures Exchange, delivered in binary format over IP multicast/UDP
    with separate channel sets for stock options and non-stock options markets. Licensed,
    sales-gated access; the binary interface specification and developers guide are
    public PDFs.
- aid: hkex:hkex-data-marketplace-historical-data
  name: HKEX Data Marketplace Historical Data
  tags:
  - Historical Data
  - Tick Data
  - Full Order Book
  - Shareholding
  - Reference Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://data.hkex.com.hk/catalog
  baseURL: https://data.hkex.com.hk
  properties:
  - url: https://data.hkex.com.hk/catalog
    type: Portal
  - url: https://www.hkex.com.hk/Services/Market-Data-Services/Historical-Data-Services/HKEX-Data-Marketplace?sc_lang=en
    type: Documentation
  description: Web-based storefront for HKEX historical and reference data straight
    from the exchange - historical full order book tick data for securities and derivatives
    (CSV), CCASS shareholding data, and securities attribute daily files. Delivered
    via SFTP, cloud-to-cloud transfer, or direct download; onboarding is handled through
    the datamarketplace@hkex.com.hk team rather than self-serve API keys, and no REST
    API is documented.
- aid: hkex:hkex-fini-api
  name: HKEX FINI API
  tags:
  - IPO
  - Settlement
  - Reference Data
  - REST
  - Post-Trade
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.hkex.com.hk/Services/Platform-Services/FINI?sc_lang=en
  properties:
  - url: https://www.hkex.com.hk/Services/Platform-Services/FINI?sc_lang=en
    type: Documentation
  - url: https://www.hkex.com.hk/-/media/HKEX-Market/Services/Next-Generation-Post-Trade-Programme/Fini/FINI-API-User-Guide-v0,-d-,41.pdf
    type: APIReference
  description: The FINI (Fast Interface for New Issuance) API Gateway offers RESTful
    JSON endpoints (e.g. GET /api/ipos/list/v1, GET /api/ipos/refdata/v1) for market
    participants to automate IPO workflows - IPO reference data, EIPO subscriptions,
    and EIPO funding. Authentication uses OAuth 2.0 JWT-bearer grants against the
    HKEX Access Management server (https://openam.connect.hkex.com.hk) with registered
    RSA JSON Web Keys, TLS 1.2, and end-to-end payload encryption. Access is restricted
    to registered HKSCC participants, FINI banks, sponsors, and advisers - not open
    self-serve signup - but the API guide is a public PDF.
